<script>
"use strict";

// ============================================================
// 三國水墨戰棋 Three Kingdoms Chess
// Phaser 3 + Tone.js，單一 HTML 檔案，全部資源程式生成
// ============================================================

// ----- 全域常數 -----
const GAME_W = 800, GAME_H = 600;
const COLS = 12, ROWS = 10;
const TILE_W = 64, TILE_H = 46;
const MAP_X = 8, MAP_Y = 36;           // 地圖左上角偏移
const INK = 0x2c1a08;                  // 深墨色（非純黑）
const PARCHMENT = 0xf4edd8;            // 仿舊宣紙
const PANEL = 0xece0c4;                // 面板宣紙色
const BORDER = 0x8b7050;               // 格線顏色

// ===== Phase 6 — 手機偵測 =====
const MOBILE = (typeof navigator !== "undefined") &&
  (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768);

// [LOGIC-START] —— 純邏輯區（不依賴 Phaser / Tone，可供 node 測試）

// ===== 地形系統 =====
const T = { PLAIN:"plain", MOUNTAIN:"mountain", FOREST:"forest", RIVER:"river", CASTLE_P:"castle_p", CASTLE_E:"castle_e" };
const TERRAIN_INFO = {
  plain:    { name:"平原", def:0, evade:0,  cost:1,  passable:true  },
  mountain: { name:"山地", def:0, evade:0,  cost:99, passable:false },
  forest:   { name:"樹林", def:2, evade:15, cost:1,  passable:true  },
  river:    { name:"河流", def:0, evade:0,  cost:2,  passable:true  },
  castle_p: { name:"城池", def:5, evade:0,  cost:1,  passable:true  },
  castle_e: { name:"城池", def:5, evade:0,  cost:1,  passable:true  }
};
const CHAR2T = { P:T.PLAIN, M:T.MOUNTAIN, F:T.FOREST, R:T.RIVER, "1":T.CASTLE_P, "2":T.CASTLE_E };

// 測試地圖（Phase 7 改為隨機生成）
const TEST_MAP_ROWS = [
  "PPFFPPPPMMPP",
  "PPPFPPPPPMPP",
  "PPPPPRRPPPPP",
  "PFPPPRRRPPFP",
  "PPPPPPRRPPPP",
  "P1PPPPRRPP2P",
  "PPPPPRRPPPPP",
  "PFPPPRPPPPFP",
  "PPMPPPPPPFPP",
  "PPMMPPPPPPPP"
];
function parseMap(rows) {
  return rows.map(r => r.split("").map(c => CHAR2T[c] || T.PLAIN));
}
function findTile(map, t) {
  for (let y = 0; y < map.length; y++)
    for (let x = 0; x < map[0].length; x++)
      if (map[y][x] === t) return [x, y];
  return null;
}

// ===== 陣營 / 兵種 / 武將 =====
const FACTIONS = {
  wei: { name: "魏", fill: 0xc8b8d8, border: 0x5a3880, css: "#5a3880" },
  shu: { name: "蜀", fill: 0xd0e0b0, border: 0x305820, css: "#305820" },
  wu:  { name: "吳", fill: 0xe8c070, border: 0x8b4010, css: "#8b4010" }
};
const TYPES = {
  infantry:   { name: "步兵", hp: 100, atk: 30, def: 18, mov: 3, rng: 1 },
  cavalry:    { name: "騎兵", hp: 90,  atk: 32, def: 12, mov: 4, rng: 1 },
  archer:     { name: "弓兵", hp: 70,  atk: 28, def: 8,  mov: 2, rng: 2 },
  strategist: { name: "軍師", hp: 60,  atk: 0,  def: 6,  mov: 2, rng: 0 }
};
const ABILITIES = {
  "武聖":   { desc: "HP低於50%時攻擊+30%", passive: true },
  "烈弓":   { desc: "本回合未移動時射程加倍", passive: true },
  "突陣":   { desc: "移動可穿越敵方單位", passive: true },
  "空城計": { desc: "跳過敵方下個回合（每場限一次）", passive: false, uses: 1 },
  "火攻":   { desc: "周圍八格敵人受35點傷害", passive: false, cd: 3 },
  "弱化":   { desc: "相鄰敵人攻擊-30%（2回合）", passive: false, cd: 3 }
};
const ROSTERS = {
  shu: [
    { general: "關羽",   type: "infantry",   ability: "武聖", atkMod: 4 },
    { general: "張飛",   type: "infantry",   atkMod: 2, defMod: 2 },
    { general: "趙雲",   type: "cavalry",    atkMod: 2 },
    { general: "黃忠",   type: "archer",     ability: "烈弓" },
    { general: "諸葛亮", type: "strategist", ability: "空城計" }
  ],
  wei: [
    { general: "張遼",   type: "cavalry",    ability: "突陣", atkMod: 3 },
    { general: "夏侯惇", type: "infantry",   atkMod: 3 },
    { general: "許褚",   type: "infantry",   defMod: 4 },
    { general: "夏侯淵", type: "archer",     atkMod: 2 },
    { general: "司馬懿", type: "strategist", ability: "弱化" }
  ],
  wu: [
    { general: "孫策",   type: "infantry",   atkMod: 4 },
    { general: "呂蒙",   type: "infantry",   defMod: 2 },
    { general: "甘寧",   type: "cavalry",    atkMod: 3 },
    { general: "太史慈", type: "archer",     atkMod: 3 },
    { general: "周瑜",   type: "strategist", ability: "火攻" }
  ]
};

let UNIT_SEQ = 0;
function makeUnit(factionKey, side, entry, x, y) {
  const base = TYPES[entry.type];
  return {
    id: ++UNIT_SEQ,
    faction: factionKey, side,
    general: entry.general, type: entry.type,
    ability: entry.ability || null,
    hp: base.hp, maxHp: base.hp,
    atk: base.atk + (entry.atkMod || 0),
    def: base.def + (entry.defMod || 0),
    mov: base.mov, rng: base.rng,
    x, y,
    moved: false, acted: false,
    abilityUses: entry.ability && ABILITIES[entry.ability].uses ? ABILITIES[entry.ability].uses : Infinity,
    cooldown: 0,
    atkDebuff: 0   // 弱化回合數
  };
}

function unitAt(units, x, y) {
  return units.find(u => u.hp > 0 && u.x === x && u.y === y) || null;
}
function livingUnits(units, side) {
  return units.filter(u => u.hp > 0 && (!side || u.side === side));
}

// 移動範圍：考慮地形成本、山地不可通行、敵人擋路（突陣例外）、不可停在他人格
function reachableTiles(map, units, unit) {
  const dist = { [unit.x + "," + unit.y]: 0 };
  const queue = [[unit.x, unit.y, 0]];
  while (queue.length) {
    queue.sort((a, b) => a[2] - b[2]);
    const [cx, cy, cd] = queue.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      const info = TERRAIN_INFO[map[ny][nx]];
      if (!info.passable) continue;
      const occ = unitAt(units, nx, ny);
      if (occ && occ.side !== unit.side && unit.ability !== "突陣") continue;
      const nd = cd + info.cost;
      if (nd > unit.mov) continue;
      const key = nx + "," + ny;
      if (dist[key] !== undefined && dist[key] <= nd) continue;
      dist[key] = nd;
      queue.push([nx, ny, nd]);
    }
  }
  const res = [];
  for (const key in dist) {
    const [x, y] = key.split(",").map(Number);
    if (x === unit.x && y === unit.y) continue;
    if (unitAt(units, x, y)) continue;
    res.push({ x, y });
  }
  return res;
}

function effectiveRng(unit) {
  if (unit.ability === "烈弓" && !unit.moved) return unit.rng * 2;  // 烈弓：靜止雙倍射程
  return unit.rng;
}
function manhattan(ax, ay, bx, by) { return Math.abs(ax - bx) + Math.abs(ay - by); }
function targetsInRange(units, unit, fromX, fromY) {
  const rng = effectiveRng(unit);
  if (rng <= 0) return [];
  return livingUnits(units).filter(t =>
    t.side !== unit.side && manhattan(fromX, fromY, t.x, t.y) <= rng);
}

// 戰鬥傷害：ATK - DEF + 地形加成；樹林迴避 MISS；10% 暴擊 x1.5
function computeDamage(attacker, defender, map, rand) {
  const dTerrain = TERRAIN_INFO[map[defender.y][defender.x]];
  if (rand() * 100 < dTerrain.evade) return { miss: true, crit: false, dmg: 0 };
  let atk = attacker.atk;
  if (attacker.ability === "武聖" && attacker.hp < attacker.maxHp * 0.5) atk *= 1.3; // 武聖
  if (attacker.atkDebuff > 0) atk *= 0.7;   // 弱化
  const crit = rand() < 0.10;
  let dmg = atk - (defender.def + dTerrain.def);
  if (crit) dmg *= 1.5;
  return { miss: false, crit, dmg: Math.max(1, Math.round(dmg)) };
}

// 城池附近出兵點：BFS 由城池向外找可站立格
function spawnPositions(map, castleX, castleY, n, occupied) {
  const seen = new Set([castleX + "," + castleY]);
  const queue = [[castleX, castleY]];
  const res = [];
  while (queue.length && res.length < n) {
    const [cx, cy] = queue.shift();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      const key = nx + "," + ny;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || seen.has(key)) continue;
      seen.add(key);
      const t = map[ny][nx];
      if (!TERRAIN_INFO[t].passable) continue;
      queue.push([nx, ny]);
      if (t !== T.CASTLE_P && t !== T.CASTLE_E && !occupied.has(key)) {
        res.push({ x: nx, y: ny });
        occupied.add(key);
        if (res.length >= n) break;
      }
    }
  }
  return res;
}

// ===== Phase 4 — AI 系統（純邏輯）=====

// 期望傷害（無隨機）：含迴避折扣與 10% 暴擊期望
function expectedDamage(attacker, defender, map) {
  const dT = TERRAIN_INFO[map[defender.y][defender.x]];
  let atk = attacker.atk;
  if (attacker.ability === "武聖" && attacker.hp < attacker.maxHp * 0.5) atk *= 1.3;
  if (attacker.atkDebuff > 0) atk *= 0.7;
  const raw = Math.max(1, Math.round(atk - (defender.def + dT.def)));
  return raw * (1 - dT.evade / 100) * 1.05;
}

// 列舉一個單位所有 (移動 + 攻擊/不攻擊) 組合
function enumerateActions(map, units, unit) {
  const moves = [{ x: unit.x, y: unit.y, stay: true }].concat(reachableTiles(map, units, unit));
  const actions = [];
  for (const mv of moves) {
    const ghost = Object.assign({}, unit, { x: mv.x, y: mv.y, moved: !mv.stay });
    actions.push({ unitId: unit.id, to: mv, targetId: null });
    for (const t of targetsInRange(units, ghost, mv.x, mv.y))
      actions.push({ unitId: unit.id, to: mv, targetId: t.id });
  }
  return actions;
}

// 威脅地圖：attackerSide 所有單位可攻擊到的格 → 累計攻擊力
function buildThreatMap(map, units, attackerSide) {
  const tm = {};
  for (const p of livingUnits(units, attackerSide)) {
    const rng = effectiveRng(Object.assign({}, p, { moved: false }));
    if (rng <= 0) continue;
    const cells = [{ x: p.x, y: p.y }].concat(reachableTiles(map, units, p));
    const seen = new Set();
    for (const c of cells) {
      for (let dx = -rng; dx <= rng; dx++) {
        const rem = rng - Math.abs(dx);
        for (let dy = -rem; dy <= rem; dy++) {
          const nx = c.x + dx, ny = c.y + dy;
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          const key = nx + "," + ny;
          if (seen.has(key)) continue;
          seen.add(key);
          const cell = tm[key] || (tm[key] = { sum: 0, max: 0 });
          cell.sum += p.atk;
          cell.max = Math.max(cell.max, p.atk);
        }
      }
    }
  }
  return tm;
}

// 加權評分（守將＝防守傾向；謀士／軍師＝進攻傾向）
function scoreAction(map, units, action, ctx) {
  const u = ctx.aiUnit;
  const to = action.to;
  let score = 0;
  const target = action.targetId ? units.find(t => t.id === action.targetId) : null;
  if (target) {
    const ghost = Object.assign({}, u, { x: to.x, y: to.y, moved: !to.stay });
    const ed = expectedDamage(ghost, target, map);
    score += Math.min(ed, target.hp) * 1.2;                       // damage_dealt
    if (ed >= target.hp) score += 40;                             // 擊殺獎勵
    const flank = livingUnits(units, u.side).some(a =>            // 側翼 +20%
      a.id !== u.id && manhattan(a.x, a.y, target.x, target.y) === 1);
    if (flank) score += ed * 0.2;
  }
  const terr = TERRAIN_INFO[map[to.y][to.x]];
  score += terr.def * 0.8;                                        // terrain_def_bonus
  const threat = ctx.threatMap[to.x + "," + to.y];                // damage_received（以最強攻擊者估算）
  if (threat) {
    // 回合越後越敢進攻（避免雙方喺威脅圈外永遠對峙）
    const caution = Math.max(0.2, 1 - (ctx.round || 1) * 0.04);
    score -= Math.max(0, threat.max - (u.def + terr.def)) * caution;
    if (u.hp < u.maxHp * 0.35) score -= 30;                       // low_hp_retreat_penalty
  }
  if (ctx.difficulty === "守將") {
    score -= manhattan(to.x, to.y, ctx.ownCastle.x, ctx.ownCastle.y) * 1.2;  // 死守城池
  } else {
    // proximity_to_stronghold：回合越後進攻意欲越強（防止無限對峙）
    const advance = 0.6 * (1 + (ctx.round || 1) * 0.2);
    score -= manhattan(to.x, to.y, ctx.targetCastle.x, ctx.targetCastle.y) * advance;
    if (to.x === ctx.targetCastle.x && to.y === ctx.targetCastle.y) score += 500;  // 佔城即勝
  }
  return score;
}

// 模擬執行動作（不改原狀態）
function applyActionSim(map, units, action) {
  const us = units.map(u => Object.assign({}, u));
  const u = us.find(x => x.id === action.unitId);
  u.x = action.to.x; u.y = action.to.y;
  if (!action.to.stay) u.moved = true;
  if (action.targetId) {
    const t = us.find(x => x.id === action.targetId);
    t.hp = Math.max(0, t.hp - Math.round(expectedDamage(u, t, map)));
  }
  return us;
}

function evaluateBoard(map, units, aiSide, ctx) {
  let score = 0;
  for (const u of livingUnits(units)) {
    if (u.side === aiSide) {
      score += u.hp;
      score += TERRAIN_INFO[map[u.y][u.x]].def * 0.8;
      score -= manhattan(u.x, u.y, ctx.targetCastle.x, ctx.targetCastle.y) * 0.6;
      if (u.hp < 30) score -= 20;
    } else {
      score -= u.hp;
    }
  }
  return score;
}

// 軍師：minimax 深度 2（AI 行動 → 玩家最佳回應）+ alpha-beta + deadline 超時保護
function chooseActionMinimax(map, units, unit, ctx, deadline) {
  const scored = enumerateActions(map, units, unit)
    .map(a => ({ a, s: scoreAction(map, units, a, ctx) }))
    .sort((p, q) => q.s - p.s)
    .slice(0, 10);                                  // 先修枝：只展開前 10 個分支
  let best = scored[0].a, bestVal = -Infinity, alpha = -Infinity;
  for (const cand of scored) {
    if (Date.now() > deadline) break;               // 超時：回傳目前最佳
    const sim = applyActionSim(map, units, cand.a);
    const val = minPlayerResponse(map, sim, ctx, alpha, deadline);
    if (val > bestVal) { bestVal = val; best = cand.a; }
    alpha = Math.max(alpha, val);
  }
  return best;
}

function minPlayerResponse(map, units, ctx, alpha, deadline) {
  let worst = Infinity;
  const enemyOf = ctx.aiUnit.side;
  const playerSide = enemyOf === "enemy" ? "player" : "enemy";
  for (const p of livingUnits(units, playerSide)) {
    if (Date.now() > deadline) break;
    let bestS = -Infinity, bestA = null;
    for (const a of enumerateActions(map, units, p)) {
      let s = 0;
      const t = a.targetId ? units.find(x => x.id === a.targetId) : null;
      if (t) {
        const g = Object.assign({}, p, { x: a.to.x, y: a.to.y, moved: !a.to.stay });
        const ed = expectedDamage(g, t, map);
        s = Math.min(ed, t.hp) + (ed >= t.hp ? 40 : 0);
      }
      if (s > bestS) { bestS = s; bestA = a; }
    }
    if (bestA) {
      const v = evaluateBoard(map, applyActionSim(map, units, bestA), enemyOf, ctx);
      worst = Math.min(worst, v);
      if (worst <= alpha) break;                    // alpha-beta 修枝
    }
  }
  return worst === Infinity ? evaluateBoard(map, units, enemyOf, ctx) : worst;
}

// 三難度入口：永遠回傳有效動作（最少 stay 原地）
function chooseAction(map, units, unit, difficulty, castles, deadline) {
  const ctx = Object.assign({ aiUnit: unit, difficulty }, castles);
  ctx.threatMap = buildThreatMap(map, units, unit.side === "enemy" ? "player" : "enemy");
  if (difficulty === "軍師" && Date.now() < deadline)
    return chooseActionMinimax(map, units, unit, ctx, deadline);
  let best = { unitId: unit.id, to: { x: unit.x, y: unit.y, stay: true }, targetId: null };
  let bestS = -Infinity;
  for (const a of enumerateActions(map, units, unit)) {
    const s = scoreAction(map, units, a, ctx);
    if (s > bestS) { bestS = s; best = a; }
  }
  return best;
}

// ===== Phase 7 — 隨機地圖生成（Cellular Automata + BFS 連通檢查）=====

// Seeded 隨機數生成器：同一 seed 永遠生成同一地圖
function seededRandom(seed) {
  let s = Math.abs(Math.floor(seed)) % 233280;
  return function () {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

// 地形比例按難度調整
function getTileWeights(difficulty) {
  return {
    "守將": { mountain: 0.10, forest: 0.15, river: 0.05 },
    "謀士": { mountain: 0.20, forest: 0.15, river: 0.10 },
    "軍師": { mountain: 0.30, forest: 0.20, river: 0.15 }
  }[difficulty] || { mountain: 0.20, forest: 0.15, river: 0.10 };
}

// 第一步：隨機填充
function generateRawMap(seed, cols, rows, w) {
  const rng = seededRandom(seed);
  const map = [];
  for (let y = 0; y < rows; y++) {
    map[y] = [];
    for (let x = 0; x < cols; x++) {
      const r = rng();
      if (r < w.mountain) map[y][x] = T.MOUNTAIN;
      else if (r < w.mountain + w.forest) map[y][x] = T.FOREST;
      else if (r < w.mountain + w.forest + w.river) map[y][x] = T.RIVER;
      else map[y][x] = T.PLAIN;
    }
  }
  return map;
}

// 第二步：Cellular Automata smoothing（跑 3 次，8 鄰域 5+ 同類就同化）
function smoothMap(map, iterations) {
  iterations = iterations || 3;
  for (let it = 0; it < iterations; it++) {
    const next = map.map(r => r.slice());
    for (let y = 1; y < map.length - 1; y++) {
      for (let x = 1; x < map[0].length - 1; x++) {
        const counts = {};
        for (let dy = -1; dy <= 1; dy++)
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const t = map[y + dy][x + dx];
            counts[t] = (counts[t] || 0) + 1;
          }
        let dominant = null, max = 0;
        for (const t in counts) if (counts[t] > max) { max = counts[t]; dominant = t; }
        if (max >= 5) next[y][x] = dominant;
      }
    }
    map = next;
  }
  return map;
}

// 第三步：河流只可以橫向或縱向，孤立河流變平原
function fixRivers(map) {
  for (let y = 0; y < map.length; y++) {
    for (let x = 0; x < map[0].length; x++) {
      if (map[y][x] !== T.RIVER) continue;
      const hasH = (map[y][x - 1] === T.RIVER) || (map[y][x + 1] === T.RIVER);
      const hasV = (map[y - 1] && map[y - 1][x] === T.RIVER) || (map[y + 1] && map[y + 1][x] === T.RIVER);
      if (!hasH && !hasV) map[y][x] = T.PLAIN;
    }
  }
  return map;
}

// 第四步：城池固定左右兩端中行，周圍 1 格強制平原
function placeCastles(map) {
  const rows = map.length, cols = map[0].length;
  const mid = Math.floor(rows / 2);
  const spots = [[1, mid, T.CASTLE_P], [cols - 2, mid, T.CASTLE_E]];
  for (const [cx, cy, t] of spots) {
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) map[ny][nx] = T.PLAIN;
      }
    map[cy][cx] = t;
  }
  return map;
}

// 第五步：BFS 連通性檢查（兩城池之間必須可通行）
function isConnectedMap(map) {
  const start = findTile(map, T.CASTLE_P), end = findTile(map, T.CASTLE_E);
  if (!start || !end) return false;
  const visited = new Set([start[0] + "," + start[1]]);
  const queue = [start];
  while (queue.length) {
    const [x, y] = queue.shift();
    if (x === end[0] && y === end[1]) return true;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || ny >= map.length || nx >= map[0].length) continue;
      const key = nx + "," + ny;
      if (visited.has(key) || !TERRAIN_INFO[map[ny][nx]].passable) continue;
      visited.add(key);
      queue.push([nx, ny]);
    }
  }
  return false;
}

// 備用地圖：全平原（必定連通）
function generateFallbackMap(cols, rows) {
  const map = [];
  for (let y = 0; y < rows; y++) map[y] = new Array(cols).fill(T.PLAIN);
  return placeCastles(map);
}

// 主函數：唔連通就 seed+1 重試，最多 10 次
function generateMap(seed, cols, rows, difficulty) {
  const w = getTileWeights(difficulty);
  for (let attempt = 0; attempt < 10; attempt++) {
    let map = generateRawMap(seed + attempt, cols, rows, w);
    map = smoothMap(map, 3);
    map = fixRivers(map);
    map = placeCastles(map);
    map = fixRivers(map);   // 城池周邊清地形後再修一次河流
    if (isConnectedMap(map)) return { map, seed: seed + attempt };
  }
  return { map: generateFallbackMap(cols, rows), seed };
}

// 關卡 seed：前三關固定（難度曲線），之後全隨機
function getRoundSeed(stage) {
  const fixed = { 1: 1001, 2: 2002, 3: 3003 };
  return fixed[stage] || Math.floor(Math.random() * 99999);
}

// ===== 主動技能 =====
function canUseAbility(u) {
  return !!u.ability && !ABILITIES[u.ability].passive && u.cooldown === 0 && u.abilityUses > 0;
}
function countAdjacentEnemies(units, unit) {  // 周圍八格（Chebyshev 距離 1）
  return livingUnits(units).filter(t => t.side !== unit.side &&
    Math.max(Math.abs(t.x - unit.x), Math.abs(t.y - unit.y)) === 1).length;
}
function unitsInDanger(map, units, side) {
  const tm = buildThreatMap(map, units, side === "enemy" ? "player" : "enemy");
  return livingUnits(units, side).filter(u => {
    const t = tm[u.x + "," + u.y];
    return t && t.sum > u.hp * 0.6;
  }).length;
}
function shouldUseAbility(map, units, unit) {
  if (!canUseAbility(unit)) return false;
  switch (unit.ability) {
    case "空城計": return unitsInDanger(map, units, unit.side) > 1;
    case "火攻":   return countAdjacentEnemies(units, unit) >= 2;
    case "弱化":   return countAdjacentEnemies(units, unit) >= 2;
    default: return false;
  }
}

// [LOGIC-END]

// ============================================================
// Phase 5 — 音效系統：Tone.js（旋律）+ jsfxr（戰鬥）8-bit 音色
// ============================================================
const SFX = {
  ready: false,
  bgmStarted: false,
  init() {
    if (this.ready || typeof Tone === "undefined") return;
    this.ready = true;
    // 主音色 — NES 方波
    this.lead = new Tone.Synth({ oscillator: { type: "square" },
      envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }, volume: -8 }).toDestination();
    // UI / 移動 — 三角波
    this.tri = new Tone.Synth({ oscillator: { type: "triangle" },
      envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.05 }, volume: -6 }).toDestination();
    // 低音 — 敗北旋律
    this.bass = new Tone.Synth({ oscillator: { type: "sawtooth" },
      envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 0.2 }, volume: -8 }).toDestination();
    // 回合鼓聲
    this.metal = new Tone.MetalSynth({ envelope: { attack: 0.001, decay: 0.4, release: 0.2 },
      harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5, volume: -16 }).toDestination();
    // jsfxr 失敗時的噪聲回退
    this.noise = new Tone.NoiseSynth({ noise: { type: "white" },
      envelope: { attack: 0.001, decay: 0.15, sustain: 0 }, volume: -12 }).toDestination();
  },
  // jsfxr 預設參數音效；不可用時回退 Tone
  fx(params, fallback) {
    try {
      if (typeof jsfxr === "function") {
        const a = new Audio();
        a.volume = 0.45;
        a.src = jsfxr(params);
        a.play();
        return;
      }
    } catch (e) { /* 回退 Tone */ }
    if (this.ready && fallback) fallback();
  },
  hit() {        // 戰鬥攻擊（HIT type）
    this.fx([3,,0.0918,,0.1762,0.7,,-0.5,,,,,,,,,,,1,,,0.2,,0.45],
      () => this.noise.triggerAttackRelease("16n"));
  },
  explosion() {  // 單位陣亡／城池陷落（EXPLOSION type）
    this.fx([3,,0.32,0.52,0.42,0.09,,,,,,,,,,0.6,,,1,,,,,0.5],
      () => { this.noise.triggerAttackRelease("8n"); this.metal.triggerAttackRelease("C2", "8n"); });
  },
  powerup() {    // 武將技能（POWERUP type）
    this.fx([0,,0.22,,0.42,0.55,,0.22,,,,,,0.35,,,,,1,,,,,0.45],
      () => ["C5","E5","G5"].forEach((n, i) => this.lead.triggerAttackRelease(n, "16n", Tone.now() + i * 0.07)));
  },
  select() { if (this.ready) this.tri.triggerAttackRelease(880, 0.08); },   // UI 選擇 880Hz 80ms
  move()   { if (this.ready) this.tri.triggerAttackRelease("E4", "32n"); },
  miss()   { if (this.ready) this.tri.triggerAttackRelease("A3", "32n"); },
  roundStart() { if (this.ready) this.metal.triggerAttackRelease("C3", "16n"); },
  gong() { if (this.ready) this.metal.triggerAttackRelease("E2", "1n"); },   // 場景轉換鑼聲
  victory() {    // 五聲音階上行
    if (!this.ready) return;
    this.stopBGM();
    ["D4","F#4","A4","D5"].forEach((n, i) => this.lead.triggerAttackRelease(n, "8n", Tone.now() + i * 0.15));
  },
  defeat() {     // 下降小調
    if (!this.ready) return;
    this.stopBGM();
    ["D4","C4","Bb3","G3"].forEach((n, i) => this.bass.triggerAttackRelease(n, "4n", Tone.now() + i * 0.3));
  },
  startBGM() {   // 五聲音階循環，square detune -10
    if (!this.ready || this.bgmStarted) return;
    this.bgmStarted = true;
    this.bgSynth = new Tone.Synth({ oscillator: { type: "square", detune: -10 },
      envelope: { attack: 0.001, decay: 0.2, sustain: 0.1, release: 0.1 }, volume: -18 }).toDestination();
    const notes = ["D3","F#3","A3","D3","A3","F#3","D3","E3"];
    let i = 0;
    this.bgmLoop = Tone.Transport.scheduleRepeat(t => {
      this.bgSynth.triggerAttackRelease(notes[i % notes.length], "8n", t);
      i++;
    }, "8n");
    Tone.Transport.start();
  },
  stopBGM() {
    if (this.bgmLoop !== undefined) {
      Tone.Transport.clear(this.bgmLoop);
      this.bgmLoop = undefined;
      this.bgmStarted = false;
    }
  }
};
// 瀏覽器要求 user gesture 後先可以啟動 AudioContext
document.addEventListener("pointerdown", () => {
  if (typeof Tone !== "undefined")
    Tone.start().then(() => { SFX.init(); SFX.startBGM(); });
}, { once: true });

// ============================================================
// Phase 8 — 場景共用：淡出 + 鑼聲轉場、宣紙背景、按鈕
// ============================================================
function fadeTo(scene, key, data) {
  SFX.gong();
  scene.cameras.main.fadeOut(300, 20, 14, 8);
  scene.cameras.main.once("camerafadeoutcomplete", () => scene.scene.start(key, data));
}

function drawParchment(scene) {
  const g = scene.add.graphics();
  g.fillStyle(PARCHMENT, 1).fillRect(0, 0, GAME_W, GAME_H);
  g.fillStyle(0xe6dcc0, 0.5);
  g.fillEllipse(0, 0, 360, 220);
  g.fillEllipse(GAME_W, GAME_H, 420, 260);
  g.fillStyle(0xdfd4b4, 0.35);
  g.fillEllipse(GAME_W, 0, 300, 180);
  return g;
}

function uiButton(scene, cx, cy, w, h, label, fontSize, onClick) {
  const r = scene.add.rectangle(cx, cy, w, h, PANEL, 1)
    .setStrokeStyle(1.5, BORDER).setInteractive({ useHandCursor: true });
  const t = scene.add.text(cx, cy, label, {
    fontSize, color: "#2c1a08", fontStyle: "bold",
    fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
  }).setOrigin(0.5);
  r.on("pointerover", () => r.setFillStyle(0xf6eed4));
  r.on("pointerout", () => r.setFillStyle(PANEL));
  r.on("pointerdown", () => { SFX.select(); onClick(); });
  return { r, t };
}

// Phase 1 — 戰場場景：水墨側視地圖渲染
// ============================================================
class BattleScene extends Phaser.Scene {
  constructor() { super("Battle"); }

  init(data) {
    this.playerFaction = data.playerFaction || "shu";
    this.enemyFaction = data.enemyFaction ||
      (this.playerFaction === "wei" ? "wu" : this.playerFaction === "shu" ? "wei" : "shu");
    this.difficulty = data.difficulty || "謀士";
    this.stage = data.stage || 1;
    // Phase 7：隨機地圖（前三關固定 seed，玩家可自訂）
    const baseSeed = (data.seed != null) ? data.seed : getRoundSeed(this.stage);
    const gen = generateMap(baseSeed, COLS, ROWS, this.difficulty);
    this.map = gen.map;
    this.usedSeed = gen.seed;
    this.riverTiles = [];
    this.waveOffset = 0;
    this.units = [];
    this.unitViews = {};        // unit.id -> container
    this.selected = null;
    this.moveSet = [];          // 可移動格
    this.attackSet = [];        // 可攻擊目標
    this.round = 1;
    this.turnSide = "player";
    this.busy = false;          // 動畫/敵方回合中鎖輸入
    this.battleOver = false;
    this.skipSide = null;       // 空城計跳過邊一方
    this.kills = 0;             // 擊破敵將數
    this.losses = 0;            // 損失我將數

  }

  create() {
    this.cameras.main.fadeIn(300, 20, 14, 8);
    document.getElementById("seed-input").style.display = "none";
    SFX.startBGM();
    this.drawBackground();
    // world 容器：地圖＋單位＋高亮，雙指縮放/拖動只作用於此層，UI 固定
    this.world = this.add.container(0, 0);
    this.drawMap();
    this.makeUnitTextures();
    this.placeUnits();
    this.hlGfx = this.add.graphics().setDepth(2);   // 範圍高亮層
    this.selGfx = this.add.graphics().setDepth(3);  // 選取框
    this.world.add([this.hlGfx, this.selGfx]);
    this.sortWorld();
    this.buildUI();

    // 觸控輸入：tap 喺 pointerup 判定（同拖動/縮放區分）
    this.input.addPointer(2);
    this.lastPinch = null;
    this.pinching = false;
    this.input.on("pointerdown", p => {
      this.downPos = { x: p.x, y: p.y };
      this.dragDist = 0;
      // 長按 500ms 顯示地形資訊
      this.holdTimer = setTimeout(() => this.showTileInfoAt(p), 500);
    });
    this.input.on("pointermove", p => {
      if (!p.isDown || this.pinching) return;
      const dx = p.x - p.prevPosition.x, dy = p.y - p.prevPosition.y;
      this.dragDist += Math.abs(dx) + Math.abs(dy);
      if (this.dragDist > 12) clearTimeout(this.holdTimer);
      // 放大後單指拖動地圖
      if (this.world.scaleX > 1.001 && this.dragDist > 12) {
        this.world.x += dx; this.world.y += dy;
        this.clampWorld();
      }
    });
    this.input.on("pointerup", p => {
      clearTimeout(this.holdTimer);
      if (this.pinching) { if (!this.input.pointer1.isDown && !this.input.pointer2.isDown) this.pinching = false; return; }
      if (this.dragDist > 12) return;   // 拖動唔當 tap
      this.onPointer(p);
    });
    this.input.keyboard.on("keydown-ESC", () => this.deselect());
    this.input.keyboard.on("keydown-ENTER", () => { if (!this.busy && this.turnSide === "player" && !this.battleOver) this.endPlayerTurn(); });
    this.seedText.setText(`地圖 seed: ${this.usedSeed}`);
    this.refreshTopBar();
  }

  // container 子物件按 depth 排序（容器內 depth 唔會自動生效）
  sortWorld() { this.world.sort("depth"); }

  // 世界座標（縮放/拖動後）→ 地圖邏輯座標
  worldPoint(p) {
    return { x: (p.x - this.world.x) / this.world.scaleX, y: (p.y - this.world.y) / this.world.scaleY };
  }

  setWorldZoom(s, cx, cy) {
    const old = this.world.scaleX;
    s = Phaser.Math.Clamp(s, 1, 2.5);
    this.world.x = cx - (cx - this.world.x) * (s / old);
    this.world.y = cy - (cy - this.world.y) * (s / old);
    this.world.setScale(s);
    this.clampWorld();
  }

  clampWorld() {
    const s = this.world.scaleX;
    const w = (MAP_X * 2 + COLS * TILE_W) * s, h = (MAP_Y + ROWS * TILE_H + 8) * s;
    this.world.x = Phaser.Math.Clamp(this.world.x, Math.min(0, GAME_W - w), 0);
    this.world.y = Phaser.Math.Clamp(this.world.y, Math.min(0, GAME_H - h), 0);
  }

  // 長按：顯示格仔地形資訊
  showTileInfoAt(p) {
    const wp = this.worldPoint(p);
    const t = this.xyToTile(wp.x, wp.y);
    if (!t) return;
    const info = TERRAIN_INFO[this.map[t.ty][t.tx]];
    this.setInfoText(`【${info.name}】 防禦加成 +${info.def}　迴避 ${info.evade}%　移動消耗 ${info.cost > 10 ? "不可通行" : info.cost}`);
    this.slideInfoIn();
  }

  // ----- 單位材質：18x22 剪影 + 三角軍旗，全 Graphics 生成 -----
  makeUnitTextures() {
    for (const fk of Object.keys(FACTIONS)) {
      for (const tk of Object.keys(TYPES)) {
        const key = `unit_${fk}_${tk}`;
        if (this.textures.exists(key)) continue;
        const f = FACTIONS[fk];
        const g = this.make.graphics({ add: false });
        const W = 26, H = 30, ox = 4, oy = 7;   // 18x22 主體 + 旗
        // 軍旗
        g.lineStyle(1.5, INK, 0.9);
        g.beginPath(); g.moveTo(ox + 15, oy - 6); g.lineTo(ox + 15, oy + 4); g.strokePath();
        g.fillStyle(f.border, 1).fillTriangle(ox + 15, oy - 6, ox + 15, oy - 1, ox + 22, oy - 3.5);
        // 主體剪影（按兵種變形）
        g.fillStyle(f.fill, 1);
        g.lineStyle(1.5, f.border, 1);
        if (tk === "cavalry") {
          g.fillEllipse(ox + 9, oy + 15, 17, 9);  g.strokeEllipse(ox + 9, oy + 15, 17, 9);   // 馬身
          g.fillEllipse(ox + 16, oy + 11, 6, 5);                                              // 馬頭
          g.fillCircle(ox + 7, oy + 7, 4);        g.strokeCircle(ox + 7, oy + 7, 4);          // 騎士
          g.fillRect(ox + 1, oy + 19, 3, 4); g.fillRect(ox + 13, oy + 19, 3, 4);              // 馬腿
        } else if (tk === "archer") {
          g.fillRect(ox + 5, oy + 9, 8, 11);  g.strokeRect(ox + 5, oy + 9, 8, 11);            // 身
          g.fillCircle(ox + 9, oy + 5, 4);    g.strokeCircle(ox + 9, oy + 5, 4);              // 頭
          g.lineStyle(1.5, INK, 0.9);
          g.beginPath(); g.arc(ox + 16, oy + 12, 7, -1.2, 1.2); g.strokePath();               // 弓
          g.beginPath(); g.moveTo(ox + 16, oy + 5); g.lineTo(ox + 16, oy + 19); g.strokePath();
        } else if (tk === "strategist") {
          g.fillTriangle(ox + 9, oy + 4, ox + 2, oy + 21, ox + 16, oy + 21);                  // 長袍
          g.lineStyle(1.5, f.border, 1);
          g.strokeTriangle(ox + 9, oy + 4, ox + 2, oy + 21, ox + 16, oy + 21);
          g.fillCircle(ox + 9, oy + 4, 3.5); g.strokeCircle(ox + 9, oy + 4, 3.5);             // 頭
          g.fillStyle(0xf4edd8, 1).fillEllipse(ox + 16, oy + 10, 7, 4);                       // 羽扇
          g.lineStyle(1, INK, 0.8).strokeEllipse(ox + 16, oy + 10, 7, 4);
        } else { // infantry
          g.fillRect(ox + 4, oy + 8, 10, 13); g.strokeRect(ox + 4, oy + 8, 10, 13);           // 身
          g.fillCircle(ox + 9, oy + 4, 4);    g.strokeCircle(ox + 9, oy + 4, 4);              // 頭
          g.lineStyle(1.5, INK, 0.9);
          g.beginPath(); g.moveTo(ox + 17, oy - 2); g.lineTo(ox + 17, oy + 20); g.strokePath(); // 長槍
          g.fillStyle(INK, 0.9).fillTriangle(ox + 15.5, oy - 2, ox + 18.5, oy - 2, ox + 17, oy - 6);
        }
        g.generateTexture(key, W, H);
        g.destroy();
      }
    }
  }

  placeUnits() {
    const pc = findTile(this.map, T.CASTLE_P), ec = findTile(this.map, T.CASTLE_E);
    this.playerCastle = { x: pc[0], y: pc[1] };
    this.enemyCastle = { x: ec[0], y: ec[1] };
    const occupied = new Set();
    const pSpawns = spawnPositions(this.map, pc[0], pc[1], 5, occupied);
    const eSpawns = spawnPositions(this.map, ec[0], ec[1], 5, occupied);
    ROSTERS[this.playerFaction].forEach((entry, i) => {
      const s = pSpawns[i];
      this.units.push(makeUnit(this.playerFaction, "player", entry, s.x, s.y));
    });
    ROSTERS[this.enemyFaction].forEach((entry, i) => {
      const s = eSpawns[i];
      this.units.push(makeUnit(this.enemyFaction, "enemy", entry, s.x, s.y));
    });
    for (const u of this.units) this.createUnitView(u);
  }

  createUnitView(u) {
    const { x, y } = this.tileCenter(u.x, u.y);
    const img = this.add.image(0, -4, `unit_${u.faction}_${u.type}`);
    if (u.side === "enemy") img.setFlipX(true);
    const hpBg = this.add.rectangle(0, 14, 20, 3.5, 0x55430a, 0.85);
    const hpBar = this.add.rectangle(-10, 14, 20, 3.5, 0x3a7a30, 1).setOrigin(0, 0.5);
    const c = this.add.container(x, y, [img, hpBg, hpBar]);
    c.setDepth(10 + u.y);
    this.world.add(c);
    this.unitViews[u.id] = { c, img, hpBar };
  }

  refreshUnitView(u) {
    const v = this.unitViews[u.id];
    if (!v) return;
    if (u.hp <= 0) { return; }
    const ratio = Math.max(0, u.hp / u.maxHp);
    v.hpBar.width = 20 * ratio;
    v.hpBar.fillColor = ratio > 0.5 ? 0x3a7a30 : ratio > 0.25 ? 0xb08020 : 0xa03020;
    v.img.setAlpha(u.acted && u.side === "player" ? 0.55 : 1);   // 已行動變灰
  }

  // ----- 介面 -----
  buildUI() {
    // 頂部橫條
    this.add.rectangle(GAME_W / 2, 16, GAME_W, 32, PANEL, 0.92)
      .setStrokeStyle(1, BORDER).setDepth(50);
    this.topBarText = this.add.text(12, 7, "", {
      fontSize: "14px", color: "#2c1a08", fontStyle: "bold",
      fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
    }).setDepth(51);
    this.seedText = this.add.text(GAME_W - 10, 8, "", {
      fontSize: "10px", color: "#8b7050", align: "right"
    }).setOrigin(1, 0).setDepth(51);

    // 底部資訊面板（容器：手機版由底部滑出，桌面版固定顯示）
    const panelW = MOBILE ? GAME_W : 330, panelH = MOBILE ? 100 : 92;
    const panelX = MOBILE ? GAME_W / 2 : 170;
    this.infoHomeY = GAME_H - 52;
    this.infoPanelC = this.add.container(0, 0).setDepth(50);
    const panelBg = this.add.rectangle(panelX, this.infoHomeY, panelW, panelH, PANEL, 0.95)
      .setStrokeStyle(1.2, BORDER);
    this.infoText = this.add.text(MOBILE ? 16 : 18, this.infoHomeY - panelH / 2 + 10, "", {
      fontSize: MOBILE ? "14px" : "13px",       // 手機最少 14px
      color: "#2c1a08", lineSpacing: 4,
      fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
    });
    this.infoPanelC.add([panelBg, this.infoText]);
    if (MOBILE) this.infoPanelC.y = 130;        // 收埋喺畫面下方

    const onEnd = () => { if (!this.busy && this.turnSide === "player" && !this.battleOver) this.endPlayerTurn(); };
    const onWait = () => { if (!this.busy && this.selected && !this.selected.acted) this.finishUnit(this.selected); };
    const onAbility = () => {
      const u = this.selected;
      if (!this.busy && u && !u.acted && canUseAbility(u)) {
        this.castAbility(u);
        if (!this.battleOver) this.deselect();
      }
    };
    if (MOBILE) {
      // 手機版：右下 2x2 大按鈕（80x70），點擊區域大過 44px
      const bw = 80, bh = 70, gap = 6;
      const x0 = GAME_W - bw * 1.5 - gap - 8, x1 = GAME_W - bw / 2 - 8;
      const y0 = GAME_H - bh * 1.5 - gap - 8, y1 = GAME_H - bh / 2 - 8;
      this.abilityBtn = this.makeButton(x0, y0, bw, bh, "技能", onAbility);
      this.waitBtn = this.makeButton(x1, y0, bw, bh, "待機", onWait);
      this.endBtn = this.makeButton((x0 + x1) / 2, y1, bw * 2 + gap, bh, "結束回合", onEnd);
    } else {
      // 桌面版：右下直排（最少 44px 高，符合觸控標準）
      this.endBtn = this.makeButton(GAME_W - 80, GAME_H - 52, 130, 44, "結束回合 ⏎", onEnd);
      this.waitBtn = this.makeButton(GAME_W - 80, GAME_H - 102, 130, 44, "待機", onWait);
      this.abilityBtn = this.makeButton(GAME_W - 80, GAME_H - 152, 130, 44, "技能", onAbility);
    }
    this.waitBtn.setVisible(false);
    this.abilityBtn.setVisible(false);
  }

  // 資訊面板滑入／滑出（手機版）
  slideInfoIn() {
    if (!MOBILE) return;
    this.tweens.add({ targets: this.infoPanelC, y: 0, duration: 200, ease: "Power2" });
  }
  slideInfoOut() {
    if (!MOBILE) return;
    this.tweens.add({ targets: this.infoPanelC, y: 130, duration: 200, ease: "Power2" });
  }
  setInfoText(s) { this.infoText.setText(s); }

  makeButton(cx, cy, w, h, label, onClick) {
    const r = this.add.rectangle(cx, cy, w, h, PANEL, 1)
      .setStrokeStyle(1.5, BORDER).setDepth(50).setInteractive({ useHandCursor: true });
    const t = this.add.text(cx, cy, label, {
      fontSize: "15px", color: "#2c1a08", fontStyle: "bold",
      fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
    }).setOrigin(0.5).setDepth(51);
    r.on("pointerover", () => r.setFillStyle(0xf6eed4));
    r.on("pointerout", () => r.setFillStyle(PANEL));
    r.on("pointerdown", e => { e.event && e.event.stopPropagation(); onClick(); });
    return { r, t, setVisible(v) { r.setVisible(v); t.setVisible(v); }, setLabel(s) { t.setText(s); } };
  }

  refreshTopBar() {
    const f = FACTIONS[this.playerFaction];
    const turnLabel = this.turnSide === "player" ? "玩家回合" : "敵方回合";
    this.topBarText.setText(`${f.name}軍　第 ${this.round} 回合　${turnLabel}　[${this.difficulty}]`);
  }

  showUnitInfo(u) {
    if (!u) { this.setInfoText(""); this.slideInfoOut(); return; }
    const tinfo = TERRAIN_INFO[this.map[u.y][u.x]];
    const ab = u.ability ? `${u.ability}：${ABILITIES[u.ability].desc}` : "—";
    this.setInfoText(
      `${FACTIONS[u.faction].name}・${u.general}（${TYPES[u.type].name}）  HP ${u.hp}/${u.maxHp}\n` +
      `攻 ${u.atk}　防 ${u.def}　移 ${u.mov}　射程 ${effectiveRng(u)}　地形:${tinfo.name}\n` +
      `技能：${ab}`
    );
    this.slideInfoIn();
  }

  // ----- 輸入處理 -----
  onPointer(p) {
    if (this.busy || this.turnSide !== "player" || this.battleOver) return;
    const wp = this.worldPoint(p);
    const t = this.xyToTile(wp.x, wp.y);
    if (!t) { this.deselect(); return; }
    const u = unitAt(this.units, t.tx, t.ty);

    // 點到攻擊範圍內敵人 → 攻擊
    if (this.selected && !this.selected.acted && u &&
        this.attackSet.some(a => a.id === u.id)) {
      this.doAttack(this.selected, u);
      return;
    }
    // 點到可移動格 → 移動
    if (this.selected && !this.selected.moved &&
        this.moveSet.some(m => m.x === t.tx && m.y === t.ty)) {
      this.doMove(this.selected, t.tx, t.ty);
      return;
    }
    // 點到自己單位 → 選取
    if (u && u.side === "player") {
      this.selectUnit(u);
      return;
    }
    if (u && u.side === "enemy") { this.showUnitInfo(u); return; }
    this.deselect();
  }

  selectUnit(u) {
    SFX.select();
    this.selected = u;
    this.showUnitInfo(u);
    this.moveSet = (!u.moved && !u.acted) ? reachableTiles(this.map, this.units, u) : [];
    this.attackSet = !u.acted ? targetsInRange(this.units, u, u.x, u.y) : [];
    this.drawHighlights();
    this.waitBtn.setVisible(!u.acted);
    this.abilityBtn.setVisible(!u.acted && canUseAbility(u));
    this.abilityBtn.setLabel(u.ability ? `技能・${u.ability}` : "技能");
  }

  deselect() {
    this.selected = null;
    this.moveSet = [];
    this.attackSet = [];
    this.hlGfx.clear();
    this.selGfx.clear();
    this.showUnitInfo(null);
    this.waitBtn.setVisible(false);
    this.abilityBtn.setVisible(false);
  }

  drawHighlights() {
    this.hlGfx.clear();
    this.selGfx.clear();
    if (!this.selected) return;
    // 藍色移動範圍
    for (const m of this.moveSet) {
      const { x, y } = this.tileToXY(m.x, m.y);
      this.hlGfx.fillStyle(0x3a6a9a, 0.32).fillRect(x + 1, y + 1, TILE_W - 2, TILE_H - 2);
      this.hlGfx.lineStyle(1, 0x3a6a9a, 0.7).strokeRect(x + 1.5, y + 1.5, TILE_W - 3, TILE_H - 3);
    }
    // 紅色攻擊目標
    for (const a of this.attackSet) {
      const { x, y } = this.tileToXY(a.x, a.y);
      this.hlGfx.fillStyle(0xb03020, 0.30).fillRect(x + 1, y + 1, TILE_W - 2, TILE_H - 2);
      this.hlGfx.lineStyle(1.5, 0xb03020, 0.85).strokeRect(x + 1.5, y + 1.5, TILE_W - 3, TILE_H - 3);
    }
    // 選取框
    const { x, y } = this.tileToXY(this.selected.x, this.selected.y);
    this.selGfx.lineStyle(2, 0xb03020, 0.95).strokeRect(x + 2, y + 2, TILE_W - 4, TILE_H - 4);
  }

  doMove(u, tx, ty) {
    SFX.move();
    this.busy = true;
    u.x = tx; u.y = ty; u.moved = true;
    const v = this.unitViews[u.id];
    const { x, y } = this.tileCenter(tx, ty);
    this.hlGfx.clear();
    this.tweens.add({
      targets: v.c, x, y, duration: 220, ease: "Power2",
      onComplete: () => {
        v.c.setDepth(10 + ty);
        this.sortWorld();
        this.busy = false;
        this.afterMove(u);
      }
    });
  }

  // 移動後：有目標就等玩家揀攻擊／待機，無目標自動結束行動
  afterMove(u) {
    this.attackSet = targetsInRange(this.units, u, u.x, u.y);
    if (this.attackSet.length === 0) { this.finishUnit(u); return; }
    this.moveSet = [];
    this.drawHighlights();
    this.showUnitInfo(u);
    this.waitBtn.setVisible(true);
    this.abilityBtn.setVisible(canUseAbility(u));
  }

  finishUnit(u) {
    u.moved = true; u.acted = true;
    this.refreshUnitView(u);
    this.deselect();
    this.checkBattleEnd();   // 佔城判定
  }

  doAttack(att, def, onDone) {
    this.busy = true;
    this.hlGfx.clear(); this.selGfx.clear();
    this.waitBtn.setVisible(false);
    this.abilityBtn.setVisible(false);
    const av = this.unitViews[att.id];
    const home = this.tileCenter(att.x, att.y);
    const tgt = this.tileCenter(def.x, def.y);
    // 向目標衝刺 30% 距離再彈回
    this.tweens.add({
      targets: av.c,
      x: home.x + (tgt.x - home.x) * 0.3,
      y: home.y + (tgt.y - home.y) * 0.3,
      duration: 110, yoyo: true, ease: "Power1",
      onYoyo: () => this.applyHit(att, def),
      onComplete: () => {
        this.busy = false;
        att.moved = true; att.acted = true;
        this.refreshUnitView(att);
        if (att.side === "player") this.deselect();
        this.checkBattleEnd();
        if (onDone) onDone();
      }
    });
  }

  applyHit(att, def) {
    const r = computeDamage(att, def, this.map, Math.random);
    const pos = this.tileCenter(def.x, def.y);
    if (r.miss) { SFX.miss(); this.floatText(pos.x, pos.y - 14, "MISS", "#5a5a72", false); return; }
    SFX.hit();
    def.hp = Math.max(0, def.hp - r.dmg);
    this.floatText(pos.x, pos.y - 14,
      (r.crit ? "暴擊 -" : "-") + r.dmg,
      r.crit ? "#c03010" : "#7a2010", r.crit);
    this.refreshUnitView(def);
    // 受擊閃白
    const dv = this.unitViews[def.id];
    if (dv) {
      dv.img.setTintFill(0xffffff);
      this.time.delayedCall(90, () => dv.img && dv.img.clearTint());
      this.cameras.main.shake(80, 0.004);
    }
    if (def.hp <= 0) this.killUnit(def);
  }

  // 飄字：傷害數字向上飄並淡出
  floatText(x, y, str, color, big) {
    const t = this.add.text(x, y, str, {
      fontSize: big ? "20px" : "16px", color, fontStyle: "bold",
      stroke: "#f4edd8", strokeThickness: 3,
      fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
    }).setOrigin(0.5).setDepth(60);
    this.world.add(t);
    this.sortWorld();
    this.tweens.add({
      targets: t, y: y - 34, alpha: 0, duration: 850, ease: "Power1",
      onComplete: () => t.destroy()
    });
  }

  killUnit(u) {
    if (u.side === "enemy") this.kills++; else this.losses++;
    SFX.explosion();
    const v = this.unitViews[u.id];
    if (!v) return;
    this.tweens.add({
      targets: v.c, alpha: 0, y: v.c.y - 10, duration: 400, ease: "Power1",
      onComplete: () => { v.c.destroy(); delete this.unitViews[u.id]; }
    });
  }

  // 勝敗檢查：殲滅 或 佔領城池（Phase 8 改為完整結算畫面）
  checkBattleEnd() {
    if (this.battleOver) return;
    const pAlive = livingUnits(this.units, "player").length;
    const eAlive = livingUnits(this.units, "enemy").length;
    const pCastleOcc = unitAt(this.units, this.playerCastle.x, this.playerCastle.y);
    const eCastleOcc = unitAt(this.units, this.enemyCastle.x, this.enemyCastle.y);
    const win = eAlive === 0 || (eCastleOcc && eCastleOcc.side === "player");
    const lose = pAlive === 0 || (pCastleOcc && pCastleOcc.side === "enemy");
    if (!win && !lose) return;
    this.battleOver = true;
    if (win) SFX.victory(); else SFX.defeat();
    this.add.rectangle(GAME_W / 2, GAME_H / 2, GAME_W, 120, 0x2c1a08, 0.82).setDepth(70);
    this.add.text(GAME_W / 2, GAME_H / 2, win ? "勝　利" : "敗　北", {
      fontSize: "46px", color: win ? "#e8c070" : "#b0b0c0", fontStyle: "bold",
      fontFamily: '"PingFang TC","Microsoft JhengHei",serif'
    }).setOrigin(0.5).setDepth(71);
    this.time.delayedCall(1800, () => fadeTo(this, "Result", {
      win, stage: this.stage, faction: this.playerFaction, difficulty: this.difficulty,
      rounds: this.round, kills: this.kills, losses: this.losses, seed: this.usedSeed
    }));
  }

  endPlayerTurn() {
    this.deselect();
    this.turnSide = "enemy";
    this.refreshTopBar();
    if (this.skipSide === "enemy") {   // 空城計：敵方按兵不動
      this.skipSide = null;
      this.floatText(GAME_W / 2, GAME_H / 2 - 40, "空城計生效！敵軍按兵不動", "#2c1a08", true);
      this.time.delayedCall(1000, () => this.startPlayerTurn());
      return;
    }
    this.time.delayedCall(500, () => this.runEnemyTurn());
  }

  // ----- Phase 4：敵方 AI 回合 -----
  runEnemyTurn() {
    if (this.battleOver) return;
    for (const u of livingUnits(this.units, "enemy")) {
      u.moved = false; u.acted = false;
      if (u.cooldown > 0) u.cooldown--;
      if (u.atkDebuff > 0) u.atkDebuff--;
    }
    const deadline = Date.now() + 3000;   // 整個 AI 回合思考上限 3 秒
    const castles = { ownCastle: this.enemyCastle, targetCastle: this.playerCastle, round: this.round };
    const queue = livingUnits(this.units, "enemy").map(u => u.id);
    const step = (i) => {
      if (this.battleOver) return;
      if (i >= queue.length) { this.time.delayedCall(400, () => this.startPlayerTurn()); return; }
      const u = this.units.find(x => x.id === queue[i]);
      if (!u || u.hp <= 0) { step(i + 1); return; }
      if (shouldUseAbility(this.map, this.units, u)) {
        this.castAbility(u);
        this.time.delayedCall(500, () => step(i + 1));   // 行動之間 500ms 可視延遲
        return;
      }
      const action = chooseAction(this.map, this.units, u, this.difficulty, castles, deadline);
      this.performAIAction(u, action, () => this.time.delayedCall(500, () => step(i + 1)));
    };
    step(0);
  }

  performAIAction(u, action, done) {
    const afterMovePart = () => {
      if (action.targetId) {
        const t = this.units.find(x => x.id === action.targetId);
        if (t && t.hp > 0) { this.doAttack(u, t, done); return; }
      }
      u.acted = true;
      this.checkBattleEnd();
      done();
    };
    if (!action) { done(); return; }
    if (!action.to.stay) {
      u.x = action.to.x; u.y = action.to.y; u.moved = true;
      const v = this.unitViews[u.id];
      const { x, y } = this.tileCenter(u.x, u.y);
      this.tweens.add({
        targets: v.c, x, y, duration: 300, ease: "Power2",
        onComplete: () => { v.c.setDepth(10 + u.y); this.sortWorld(); this.checkBattleEnd(); if (!this.battleOver) afterMovePart(); }
      });
    } else afterMovePart();
  }

  // ----- 主動技能（玩家／AI 共用）-----
  castAbility(u) {
    SFX.powerup();
    const pos = this.tileCenter(u.x, u.y);
    const adj = livingUnits(this.units).filter(t => t.side !== u.side &&
      Math.max(Math.abs(t.x - u.x), Math.abs(t.y - u.y)) === 1);
    if (u.ability === "空城計") {
      u.abilityUses--;
      this.skipSide = u.side === "player" ? "enemy" : "player";
      this.floatText(pos.x, pos.y - 22, "空城計！", "#2c1a08", true);
    } else if (u.ability === "火攻") {
      u.cooldown = ABILITIES["火攻"].cd;
      this.floatText(pos.x, pos.y - 22, "火攻！", "#c03010", true);
      for (const t of adj) {
        t.hp = Math.max(0, t.hp - 35);
        const tp = this.tileCenter(t.x, t.y);
        this.floatText(tp.x, tp.y - 14, "-35", "#c05010", false);
        this.refreshUnitView(t);
        if (t.hp <= 0) this.killUnit(t);
      }
    } else if (u.ability === "弱化") {
      u.cooldown = ABILITIES["弱化"].cd;
      this.floatText(pos.x, pos.y - 22, "弱化！", "#404080", true);
      for (const t of adj) {
        t.atkDebuff = 2;
        const tp = this.tileCenter(t.x, t.y);
        this.floatText(tp.x, tp.y - 14, "攻↓", "#404080", false);
      }
    }
    u.acted = true; u.moved = true;
    this.refreshUnitView(u);
    this.checkBattleEnd();
  }

  startPlayerTurn() {
    if (this.battleOver) return;
    this.round++;
    this.turnSide = "player";
    SFX.roundStart();
    for (const u of livingUnits(this.units, "player")) {
      if (u.cooldown > 0) u.cooldown--;
      if (u.atkDebuff > 0) u.atkDebuff--;
      u.moved = false; u.acted = false;
      this.refreshUnitView(u);
    }
    this.refreshTopBar();
    if (this.skipSide === "player") {   // AI 空城計：我軍被跳過
      this.skipSide = null;
      this.floatText(GAME_W / 2, GAME_H / 2 - 40, "敵方空城計！我軍按兵不動", "#2c1a08", true);
      for (const u of livingUnits(this.units, "player")) u.acted = true;
      this.time.delayedCall(1200, () => { if (!this.battleOver) this.endPlayerTurn(); });
    }
  }

  // ----- 座標轉換 -----
  tileToXY(tx, ty) { return { x: MAP_X + tx * TILE_W, y: MAP_Y + ty * TILE_H }; }
  tileCenter(tx, ty) { return { x: MAP_X + tx * TILE_W + TILE_W / 2, y: MAP_Y + ty * TILE_H + TILE_H / 2 }; }
  xyToTile(px, py) {
    const tx = Math.floor((px - MAP_X) / TILE_W), ty = Math.floor((py - MAP_Y) / TILE_H);
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return null;
    return { tx, ty };
  }

  drawBackground() {
    // 宣紙底 + 四角淡墨暈染
    const g = this.add.graphics();
    g.fillStyle(PARCHMENT, 1).fillRect(0, 0, GAME_W, GAME_H);
    g.fillStyle(0xe6dcc0, 0.5);
    g.fillEllipse(0, 0, 360, 220);
    g.fillEllipse(GAME_W, GAME_H, 420, 260);
    g.fillStyle(0xdfd4b4, 0.35);
    g.fillEllipse(GAME_W, 0, 300, 180);
  }

  drawMap() {
    const g = this.add.graphics().setDepth(0);
    this.riverTiles = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        this.drawTile(g, x, y, this.map[y][x]);
      }
    }
    // 河流波紋獨立 Graphics，每幀重繪製造流動感
    this.riverGfx = this.add.graphics().setDepth(1);
    this.world.add([g, this.riverGfx]);
  }

  drawTile(g, tx, ty, t) {
    const { x, y } = this.tileToXY(tx, ty);
    const baseColors = {
      plain: 0xd4c9a8, mountain: 0xc0b690, forest: 0xb8c4a0,
      river: 0xb0c4d0, castle_p: 0xd4c9a8, castle_e: 0xd4c9a8
    };
    // 底色塊（側視微凸效果：頂部亮 1px、底部 2px 深色陰影線）
    g.fillStyle(baseColors[t], 1).fillRect(x, y, TILE_W, TILE_H);
    g.lineStyle(0.8, BORDER, 0.9).strokeRect(x + 0.5, y + 0.5, TILE_W - 1, TILE_H - 1);
    g.lineStyle(2, 0x9a8a68, 0.55);
    g.beginPath(); g.moveTo(x + 1, y + TILE_H - 1); g.lineTo(x + TILE_W - 1, y + TILE_H - 1); g.strokePath();
    g.lineStyle(1, 0xfaf4e0, 0.5);
    g.beginPath(); g.moveTo(x + 1, y + 1); g.lineTo(x + TILE_W - 1, y + 1); g.strokePath();

    if (t === T.MOUNTAIN) this.drawMountain(g, x, y);
    else if (t === T.FOREST) this.drawForest(g, x, y, tx, ty);
    else if (t === T.RIVER) this.riverTiles.push({ x, y });
    else if (t === T.CASTLE_P || t === T.CASTLE_E) this.drawCastle(g, x, y, t === T.CASTLE_P);
  }

  drawMountain(g, x, y) {
    // 2-3 個重疊三角峰，水墨色
    const cx = x + TILE_W / 2, by = y + TILE_H - 6;
    g.fillStyle(0x9a8a60, 1).fillTriangle(cx - 24, by, cx - 4, by, cx - 14, by - 26);
    g.fillStyle(0x7a6a40, 1).fillTriangle(cx - 10, by, cx + 16, by, cx + 3, by - 32);
    g.fillStyle(0x9a8a60, 0.9).fillTriangle(cx + 6, by, cx + 26, by, cx + 16, by - 20);
    // 峰頂淡雪 + 墨線
    g.fillStyle(0xf4edd8, 0.6).fillTriangle(cx - 1, by - 32, cx + 7, by - 32 + 8, cx - 6, by - 32 + 9);
    g.lineStyle(1, INK, 0.5);
    g.beginPath(); g.moveTo(cx + 3, by - 32); g.lineTo(cx + 16, by); g.strokePath();
  }

  drawForest(g, x, y, tx, ty) {
    // 3-4 個墨點樹冠，交錯高度
    const seeds = [(tx * 7 + ty * 13) % 5, (tx * 3 + ty * 11) % 7];
    const pts = [
      { dx: 14, dy: 22, r: 9 }, { dx: 30, dy: 14 + seeds[0], r: 11 },
      { dx: 46, dy: 24, r: 8 }, { dx: 38 + seeds[1] % 4, dy: 30, r: 7 }
    ];
    for (const p of pts) {
      // 樹幹
      g.lineStyle(1.5, 0x4a3a20, 0.7);
      g.beginPath(); g.moveTo(x + p.dx, y + p.dy + p.r - 2); g.lineTo(x + p.dx, y + TILE_H - 5); g.strokePath();
      // 墨點樹冠（低 alpha 疊出層次）
      g.fillStyle(0x508040, 0.55).fillEllipse(x + p.dx, y + p.dy, p.r * 2, p.r * 1.5);
      g.fillStyle(0x3a6030, 0.4).fillEllipse(x + p.dx - 2, y + p.dy + 2, p.r * 1.4, p.r);
    }
  }

  drawCastle(g, x, y, isPlayer) {
    const wall = isPlayer ? 0xc8a060 : 0xc0b8d0;
    const dark = isPlayer ? 0x8a6830 : 0x787090;
    // 城牆主體
    g.fillStyle(wall, 1).fillRect(x + 8, y + 14, TILE_W - 16, TILE_H - 20);
    g.lineStyle(1, INK, 0.8).strokeRect(x + 8, y + 14, TILE_W - 16, TILE_H - 20);
    // 城垛
    for (let i = 0; i < 4; i++) {
      g.fillStyle(dark, 1).fillRect(x + 10 + i * 12, y + 8, 8, 8);
      g.lineStyle(1, INK, 0.6).strokeRect(x + 10 + i * 12, y + 8, 8, 8);
    }
    // 城門
    g.fillStyle(0x3a2a10, 1).fillRect(x + TILE_W / 2 - 6, y + TILE_H - 18, 12, 12);
    // 旗幟
    g.lineStyle(1.5, INK, 0.9);
    g.beginPath(); g.moveTo(x + TILE_W - 14, y + 2); g.lineTo(x + TILE_W - 14, y + 16); g.strokePath();
    g.fillStyle(isPlayer ? 0xb03020 : 0x304080, 0.9).fillTriangle(
      x + TILE_W - 14, y + 2, x + TILE_W - 14, y + 10, x + TILE_W - 2, y + 6);
  }

  update() {
    // 雙指縮放（pinch-to-zoom）
    const p1 = this.input.pointer1, p2 = this.input.pointer2;
    if (p1 && p2 && p1.isDown && p2.isDown) {
      this.pinching = true;
      clearTimeout(this.holdTimer);
      const d = Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y);
      if (this.lastPinch) {
        this.setWorldZoom(this.world.scaleX * (d / this.lastPinch), (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
      }
      this.lastPinch = d;
    } else {
      this.lastPinch = null;
    }

    // 河流波紋流動：三條正弦線，x 相位每幀 +0.3
    if (!this.riverGfx) return;
    this.waveOffset += 0.3;
    const rg = this.riverGfx;
    rg.clear();
    rg.lineStyle(1.5, 0x3a6a8a, 0.75);
    for (const rt of this.riverTiles) {
      for (let line = 0; line < 3; line++) {
        const baseY = rt.y + 10 + line * 13;
        rg.beginPath();
        for (let px = 4; px <= TILE_W - 4; px += 4) {
          const wy = baseY + Math.sin((px + this.waveOffset + line * 17) / 7) * 2.2;
          if (px === 4) rg.moveTo(rt.x + px, wy); else rg.lineTo(rt.x + px, wy);
        }
        rg.strokePath();
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  parent: "game-container",
  backgroundColor: "#f4edd8",
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    min: { width: 320, height: 240 },
    max: { width: 1600, height: 1200 }
  },
  scene: [TitleScene, BattleScene, ResultScene]
};

window.addEventListener("load", () => {
  window.game = new Phaser.Game(config);
});
</script>
</body>
</html>
