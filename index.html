<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三國水墨戰棋 — Three Kingdoms Chess</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1208;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: "PingFang TC", "Microsoft JhengHei", serif;
  }
  #game-container canvas {
    max-width: 100vw;
    max-height: 100vh;
    touch-action: none; /* 防止瀏覽器預設手勢干擾 */
  }
  /* seed 輸入框（標題畫面用，DOM overlay） */
  #seed-input {
    position: absolute;
    display: none;
    width: 130px;
    padding: 4px 8px;
    background: #ece0c4;
    border: 1px solid #8b7050;
    color: #2c1a08;
    font-size: 13px;
    outline: none;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
</head>
<body>
<div id="game-container"></div>
<input id="seed-input" type="text" placeholder="輸入 seed（可留空）" inputmode="numeric">
<script>
"use strict";

// ============================================================
// 三國水墨戰棋 Three Kingdoms Chess
// Phaser 3 + Tone.js，單一 HTML 檔案，全部資源程式生成
// ============================================================

// ----- 全域常數 -----
const GAME_W = 800, GAME_H = 600;
const COLS = 12, ROWS = 10;
const TILE_W = 64, TILE_H = 46;
const MAP_X = 8, MAP_Y = 36;           // 地圖左上角偏移
const INK = 0x2c1a08;                  // 深墨色（非純黑）
const PARCHMENT = 0xf4edd8;            // 仿舊宣紙
const PANEL = 0xece0c4;                // 面板宣紙色
const BORDER = 0x8b7050;               // 格線顏色

// ----- 載入畫面（Phaser 啟動前顯示） -----
// 場景於後續 Phase 加入

const config = {
  type: Phaser.AUTO,
  width: GAME_W,
  height: GAME_H,
  parent: "game-container",
  backgroundColor: "#f4edd8",
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    min: { width: 320, height: 240 },
    max: { width: 1600, height: 1200 }
  },
  scene: []   // 場景於各 Phase 註冊
};

window.addEventListener("load", () => {
  window.game = new Phaser.Game(config);
});
</script>
</body>
</html>
